---
- name: Install python3-pip
  ansible.builtin.apt:
    name: python3-pip
    state: present
  register: result
  until: result is succeeded

- name: Remove docker-py python module
  ansible.builtin.pip:
    name: docker-py
    state: absent
    extra_args: --break-system-packages
  register: result
  until: result is succeeded

- name: Install docker python module
  ansible.builtin.pip:
    name: docker
    state: present
    extra_args: --break-system-packages
  register: result
  until: result is succeeded

- name: Create Docker home directory
  ansible.builtin.file:
    path: "{{ docker_home }}"
    mode: 0755
    state: directory

- name: Add user account to Docker group
  ansible.builtin.user:
    name: "{{ ansible_nas_user }}"
    groups: docker
    append: yes

- name: Generate Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_json | to_nice_json }}"
  register: docker_config

- name: Restart Docker # noqa no-handler
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_config.changed

- name: Ensure systemd drop-in directory for docker exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add DOCKER_API_VERSION environment to docker systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-environment.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      Environment="DOCKER_API_VERSION=1.43"
  register: docker_dropin

- name: Reload systemd if docker config or drop-in changed
  ansible.builtin.command:
    cmd: systemctl daemon-reload
  when: docker_config.changed or docker_dropin.changed

- name: Restart Docker when config or drop-in changed
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_config.changed or docker_dropin.changed