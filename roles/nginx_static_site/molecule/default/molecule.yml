---
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  inventory:
    group_vars:
      all:
        nginx_static_site_enabled: true
        nginx_static_site_root: /tmp/ansible-nas/nginx-static-site-molecule
        nginx_static_site_config_directory: /tmp/ansible-nas/nginx-static-site-config
        nginx_static_site_bind_address: 0.0.0.0
        nginx_static_site_index: common/html/default.htm
        nginx_static_site_allowlist:
          - 127.0.0.1/32
        nginx_static_site_container_name: nginx_static_site_molecule
  playbooks:
    prepare: prepare.yml
